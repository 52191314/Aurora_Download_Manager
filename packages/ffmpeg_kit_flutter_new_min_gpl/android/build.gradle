buildscript {
    ext.kotlin_version = "2.2.0"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.antonkarpenko.ffmpegkit"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    defaultConfig {
        minSdk = 24
        versionCode 1
        versionName "1.0.0"
        consumerProguardFiles 'consumer-rules.pro'
    }

    def isFdroid = (System.getenv("AURORA_BUILD_CHANNEL") ?: "").equalsIgnoreCase("fdroid") ||
        (rootProject.findProperty("auroraBuildChannel") ?: "").toString().equalsIgnoreCase("fdroid") ||
        (gradle.extensions.extraProperties.has("auroraFdroidChannel") && gradle.extensions.extraProperties.get("auroraFdroidChannel"))

    sourceSets {
        main {
            if (isFdroid) {
                java.srcDirs = ['src/fdroid/java']
            } else {
                java.srcDirs = ['src/main/java']
            }
        }
    }

    dependencies {
        implementation("androidx.annotation:annotation:1.9.1")
        if (!isFdroid) {
            implementation("com.antonkarpenko:ffmpeg-kit-min-gpl:2.2.2")
        }
    }
}
