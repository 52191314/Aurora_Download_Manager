# Static donation landing site — served as a Workers static-assets project.
# No Worker script: the website/ folder is the whole deployment.
# Deployed via Cloudflare Workers & Pages (Git integration), deploy command:
#   npx wrangler deploy
name = "aurora-download-manager"
compatibility_date = "2026-01-01"

[assets]
directory = "./website"
# Unmatched paths (e.g. /donation) serve index.html — replaces the
# _redirects rewrite, which assets-only Workers do not process.
not_found_handling = "single-page-application"
